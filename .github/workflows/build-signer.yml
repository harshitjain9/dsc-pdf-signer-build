name: Build Broto DSC Signer (Windows, 64 + 32-bit)
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    # 64-bit = the Signer everyone gets; 32-bit = for a PC whose 64-bit token driver will not
    # start while its 32-bit copy still signs ("Switch to 32-bit", Signer 2.6.7+).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
            machine: "0x8664"
            artifact: BrotoSigner-windows
          - arch: x86
            bits: 32
            machine: "0x14c"
            artifact: BrotoSigner-windows-x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: The Python is ${{ matrix.bits }}-bit
        run: python -c "import struct, sys; print(sys.version); assert struct.calcsize('P') * 8 == ${{ matrix.bits }}"
      - name: Install dependencies
        working-directory: broto_signer
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE) { throw "pip failed" }
          # cryptography 48.0.1 is the newest with a ready-made 32-bit Windows package (pyHanko 0.38 needs >= 48.0.0)
          $extra = @()
          if ("${{ matrix.arch }}" -eq "x86") { $extra = @("cryptography==48.0.1", "--only-binary", "cryptography") }
          pip install -r requirements.txt @extra
          if ($LASTEXITCODE) { throw "pip failed" }
          pip install pyinstaller pillow
          if ($LASTEXITCODE) { throw "pip failed" }
      - name: Signer tests (bridge, settings incl. Windows DPAPI PIN round-trip, screen state)
        run: |
          pip install pytest
          python -m pytest tests/test_broto_signer_bridge.py tests/test_broto_signer_core.py tests/test_broto_signer_remote.py tests/test_broto_signer_app.py tests/test_broto_signer_updater.py -q
      - name: Build BrotoSigner.exe
        working-directory: broto_signer
        run: >
          python -m PyInstaller --onefile --windowed --name BrotoSigner
          --icon assets/broto.ico --add-data "assets;assets"
          --collect-all pyhanko --collect-all pyhanko_certvalidator
          --collect-all asn1crypto --collect-all pkcs11
          --collect-all customtkinter --collect-all tkinterdnd2 app.py
      - name: The exe is ${{ matrix.bits }}-bit
        run: python -c "import struct; d = open('broto_signer/dist/BrotoSigner.exe', 'rb').read(4096); pe = struct.unpack_from('<I', d, 0x3C)[0]; m = struct.unpack_from('<H', d, pe + 4)[0]; print('PE machine', hex(m)); assert m == ${{ matrix.machine }}"
      - name: Smoke-test the exe starts (login screen, right version) and keeps the bridge shut until login
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "BrotoSigner-error.log"
          if (Test-Path $log) { Remove-Item $log }
          $want = (Select-String -Path broto_signer/app.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $p = Start-Process -FilePath broto_signer/dist/BrotoSigner.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { if (Test-Path $log) { Get-Content $log }; throw "exe exited early (code $($p.ExitCode))" }
          # 2.4+: a PC nobody has logged in on opens the Broto login screen; its title carries the version.
          $win = Get-Process BrotoSigner -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1
          Write-Host ("window title: " + $win.MainWindowTitle)
          if (-not $win -or -not $win.MainWindowTitle.EndsWith("v$want")) { throw "no Broto Signer v$want window" }
          # Only Broto users may use the Signer: the one-click bridge stays shut until someone logs in.
          $answered = $false
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:47811/status -Headers @{ Origin = "https://brotoai.com" } -TimeoutSec 5 -ErrorAction Stop | Out-Null
            $answered = $true
          } catch { Write-Host "bridge shut before login - OK" }
          if ($answered) { throw "the bridge answered before anyone logged in" }
          # A --onefile exe is a launcher + a child process with the same name: stop BOTH.
          Get-Process BrotoSigner -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (Get-Process BrotoSigner -ErrorAction SilentlyContinue) { throw "BrotoSigner still running" }
          Write-Host "exe v$want ran (login screen), bridge shut until login, all copies stopped - OK"
      - name: UI screenshots
        if: matrix.arch == 'x64'
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "resolution unchanged" }
          New-Item -ItemType Directory -Force shots | Out-Null
          $ErrorActionPreference = "Continue"
          foreach ($m in "light","dark") { foreach ($s in "empty","ready","done","log","approve","savepin") {
            Write-Host "== $m $s"
            python ci/shot.py $m $s "shots/$m-$s.png"
            Write-Host "exit $LASTEXITCODE"
          } }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: broto_signer/dist/BrotoSigner.exe
          if-no-files-found: error
      - name: Upload screenshots
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: warn
