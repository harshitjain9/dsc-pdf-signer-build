name: Build Broto DSC Signer (Windows)
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: broto_signer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Bridge + settings tests (incl. Windows DPAPI PIN round-trip)
        run: |
          pip install pytest
          python -m pytest tests/test_broto_signer_bridge.py -q
      - name: Build BrotoSigner.exe
        working-directory: broto_signer
        run: >
          python -m PyInstaller --onefile --windowed --name BrotoSigner
          --icon assets/broto.ico --add-data "assets;assets"
          --collect-all pyhanko --collect-all pyhanko_certvalidator
          --collect-all asn1crypto --collect-all pkcs11
          --collect-all customtkinter --collect-all tkinterdnd2 app.py
      - name: Smoke-test the exe starts
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "BrotoSigner-error.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath broto_signer/dist/BrotoSigner.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { if (Test-Path $log) { Get-Content $log }; throw "exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe still running after 20s - OK"
      - name: UI screenshots
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "resolution unchanged" }
          New-Item -ItemType Directory -Force shots | Out-Null
          $ErrorActionPreference = "Continue"
          foreach ($m in "light","dark") { foreach ($s in "empty","ready","done","log","approve","savepin") {
            Write-Host "== $m $s"
            python ci/shot.py $m $s "shots/$m-$s.png"
            Write-Host "exit $LASTEXITCODE"
          } }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrotoSigner-windows
          path: broto_signer/dist/BrotoSigner.exe
          if-no-files-found: error
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: warn
